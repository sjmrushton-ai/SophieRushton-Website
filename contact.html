<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Soph Rushton for pattern commissions and collaborations.">
    <title>Contact | Soph Rushton</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="contact-page">
    <header class="site-header">
        <div class="container nav-wrap">
            <a class="brand" href="index.html" aria-label="Home">
                <img src="assets/logo.png" alt="Soph Rushton logo">
            </a>
            <button class="menu-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav id="primary-nav" class="site-nav" aria-label="Primary">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="press.html">Press</a>
                <a href="contact.html" aria-current="page">Contact</a>
            </nav>
        </div>
    </header>

    <main class="page-main">
        <section class="section">
            <div class="container contact-layout">
                <div>
                    <p class="eyebrow">Contact</p>
                    <h1 class="title-artwork">
                        <img src="assets/titles/contact-title.svg" alt="Open for selected collaborations and commissions.">
                    </h1>
                    <p class="lead">
                        For bespoke artwork, creative partnerships, or project enquiries, please get in touch.
                    </p>
                    <p><a class="email-link" href="mailto:sjmrushton@gmail.com">sjmrushton@gmail.com</a></p>
                    <p><a class="email-link" href="tel:+447896653019">+44 7896653019</a></p>
                    <p class="contact-instagram">
                        <a class="instagram-icon-link" href="https://www.instagram.com/sophrushtonart/?igsh=dzE1a2Z4eHlkZGw3&utm_source=qr#" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M7.75 2.5h8.5a5.25 5.25 0 0 1 5.25 5.25v8.5a5.25 5.25 0 0 1-5.25 5.25h-8.5a5.25 5.25 0 0 1-5.25-5.25v-8.5A5.25 5.25 0 0 1 7.75 2.5Zm0 1.5A3.75 3.75 0 0 0 4 7.75v8.5A3.75 3.75 0 0 0 7.75 20h8.5A3.75 3.75 0 0 0 20 16.25v-8.5A3.75 3.75 0 0 0 16.25 4h-8.5Zm9.1 1.15a.95.95 0 1 1 0 1.9.95.95 0 0 1 0-1.9ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 1.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/>
                            </svg>
                        </a>
                        <a class="instagram-icon-link" href="https://substack.com/@sophierushton" target="_blank" rel="noopener noreferrer" aria-label="Substack">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M4 3h16v2H4V3Zm0 4h16v2H4V7Zm0 4h16v2H4v-2Zm0 4.25 8 4.75 8-4.75V13.5H4v1.75Z"/>
                            </svg>
                        </a>
                    </p>
                </div>
                <form id="contactForm" class="contact-form" action="https://formspree.io/f/your-form-id" method="POST">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" required>

                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required>

                    <label for="subject">Subject</label>
                    <input id="subject" name="subject" type="text" required>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>

                    <p id="formStatus" class="form-status" aria-live="polite"></p>
                    <button class="btn btn-primary" type="submit">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-wrap">
            <p>Amsterdam & London</p>
            <a class="email-link" href="mailto:sjmrushton@gmail.com">sjmrushton@gmail.com</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
