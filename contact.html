<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Soph Rushton for pattern commissions and collaborations.">
    <title>Contact | Soph Rushton</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container nav-wrap">
            <a class="brand" href="index.html">Soph Rushton</a>
            <button class="menu-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav id="primary-nav" class="site-nav" aria-label="Primary">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html" aria-current="page">Contact</a>
            </nav>
        </div>
    </header>

    <main class="page-main">
        <section class="section">
            <div class="container contact-layout">
                <div>
                    <p class="eyebrow">Contact</p>
                    <h1>Let's create something meaningful.</h1>
                    <p class="lead">
                        For collaborations, commissions, and project enquiries, send a message and I will get back to you soon.
                    </p>
                    <p><a href="mailto:sjmrushton@gmail.com">sjmrushton@gmail.com</a></p>
                </div>
                <form id="contactForm" class="contact-form" action="https://formspree.io/f/your-form-id" method="POST">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" required>

                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required>

                    <label for="subject">Subject</label>
                    <input id="subject" name="subject" type="text" required>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>

                    <p id="formStatus" class="form-status" aria-live="polite"></p>
                    <button class="btn btn-primary" type="submit">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-wrap">
            <p>Amsterdam & London</p>
            <a href="mailto:sjmrushton@gmail.com">sjmrushton@gmail.com</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
